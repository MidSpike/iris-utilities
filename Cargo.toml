# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "iris-utilities"
version = "4.0.0"
edition = "2024"

# Entry point for I.R.I.S. Utilities
[[bin]]
name = "iris-utilities"
path = "src/main.rs"

# Used as a cache for Docker images
[[bin]]
name = "docker-cache"
path = "src/_docker_cache.rs"

# Dependencies
[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
indoc = "2.0.7"
itertools = "0.14.0"
rand = "0.10.0"
regex = "1.12.3"
rustls = "0.23.37"
serde = "1.0.228"
serde_json = "1.0.149"
sha256 = "1.6.0"
sysinfo = "0.38.4"
tempfile = "3.27.0"
tokio-stream = "0.1.18"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"

# Not currently used, but is helpful for debugging
# env_logger = "0.11.8"

[dependencies.derive_more]
version = "2.1.1"
features = ["full"]

[dependencies.headless_chrome]
git = "https://github.com/rust-headless-chrome/rust-headless-chrome"
features = ["fetch"]

[dependencies.lavalink-rs]
git = "https://gitlab.com/vicky5124/lavalink-rs/"
features = ["songbird"]

[dependencies.mongodb]
version = "3.5.2"

[dependencies.poise]
git = "https://github.com/serenity-rs/poise/"

[dependencies.reqwest]
version = "0.13.2"
features = ["json"]

[dependencies.async-openai]
version = "0.34.0"
features = ["responses"]

[dependencies.songbird]
git = "https://github.com/serenity-rs/songbird/"
features = ["gateway", "receive"]

[dependencies.symphonia]
version = "0.5.5"
features = ["aac", "mp3", "isomp4", "alac"]

[dependencies.tokio]
version = "1.51.1"
features = ["full"]

[dependencies.image]
version = "0.25.10"
features = ["png"]
