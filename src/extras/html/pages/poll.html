<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Oswald&display=swap');
            * {
                box-sizing: border-box;
            }
            html {
                display: flex;
                margin: 0px;
                padding: 0px;
                width: 1000px;
                height: 1000px;
                overflow: hidden;
            }
            body {
                width: 100%;
                height: 100%;
                margin: 0px;
                padding: 0px;
            }
            div {
                color: #ff5500;
                font-size: 2rem;
                text-align: left;
                font-family: 'Oswald', Helvetica, Arial, sans-serif;
                font-weight: 500;
                text-shadow: 0.1em 0.1em 0.1em #000000;
            }
            div.parent {
                background-image: radial-gradient(circle at center, hsl(20, 100%, 5%), hsl(20, 100%, 22%));
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: stretch;
                align-items: stretch;
                width: 100%;
                height: 100%;
                padding: 1rem;
            }
            div.poll-options {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                flex-grow: 1;
            }
            div.poll-option {
                border: 0.25rem solid #000000;
                border-radius: 1rem;
                backdrop-filter: blur(0.5rem);
                background-color: hsla(20, 100%, 5%, 0.5);
                display: flex;
                justify-content: start;
                align-items: center;
                width: 100%;
                height: auto;
                margin: 0px;
                padding: 0.5rem 1rem;
                font-size: 2.5rem;
            }
        </style>
    </head>
    <body id="screenshot">
        <div class="parent">
            <div class="poll-options">
                {poll_options}
            </div>
        </div>
    </body>
</html>
